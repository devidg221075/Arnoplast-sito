{% extends "base.html" %}
{% block main %}
<nav class="breadcrumb"><a href="/{{ lang }}/">{{ t('breadcrumb.home') }}</a></nav>
<h1>{{ text(line.name) }}</h1>
<h2>{{ t('family.families') }}</h2>
<ul class="family-list">
{% for f in line.families %}
  <li><a href="/{{ lang }}/{{ line.slug }}/{{ f.slug }}/">{{ text(f.name) }}</a> <span class="count">({{ f.products | length }})</span></li>
{% endfor %}
</ul>
{% endblock %}
